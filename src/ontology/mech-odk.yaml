id: mech
title: "Mechanical Testing Ontology"
github_org: materialdigital
git_main_branch: main
repo: Mechanical-Testing-Ontology
uribase: https://w3id.org/pmd
uribase_suffix: mech
preferredPrefix: MECH
edit_format: owl

# DISABLE Templates for now
use_templates: false

import_group:
  annotate_with_labels: true
  annotation_properties: ['rdfs:label', 'skos:definition', 'skos:example', 'skos:comment', 'skos:altLabel' ]
  
  products:
    - id: pmdco
      title: "PMD Core Ontology"
      # mirror_from: https://materialdigital.github.io/core-ontology/ontology.owl
      mirror_from: https://raw.githubusercontent.com/materialdigital/core-ontology/refs/heads/main/src/ontology/pmdco.ttl
      module_type: custom
    - id: tto
      mirror_from: https://raw.githubusercontent.com/materialdigital/tensile-test-ontology/refs/heads/main/src/ontology/tto-full.owl 
      module_type: custom
    - id: uo
      mirror_from: https://raw.githubusercontent.com/bio-ontology-research-group/unit-ontology/refs/heads/master/uo-full.owl
      module_type: custom
    - id: qudt
      mirror_from: https://qudt.org/qudt-all
      module_type: custom
    - id: iao
      title: "Information Artifact Ontology"
      mirror_from: https://raw.githubusercontent.com/information-artifact-ontology/IAO/refs/heads/master/iao.owl
      module_type: custom

# Components
components:
  products:
    - filename: imports-edit.owl
    - filename: mech-axioms-shared.owl
    - filename: mech-tensile-test.owl
    - filename: mech-fatigue.owl
    - filename: mech-hardness.owl
    - filename: mech-devices.owl
    - filename: mech-materials.owl
    - filename: mech-shared.owl

# Release
primary_release: full
release_artefacts:
  - base
  - full
export_formats:
  - owl
  - ttl

ci:
  - github_actions

namespaces:
  - https://w3id.org/pmd/mech/

